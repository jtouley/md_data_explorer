# Dependabot version updates: weekly, one grouped PR per ecosystem (security updates stay separate).
# Options: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # Actions are pinned to full commit SHAs with the tag in a comment; Dependabot bumps both.
  # "/" covers .github/workflows only: each local composite action is listed by its directory.
  - package-ecosystem: "github-actions"
    directories: ["/", "/.github/actions/setup-app", "/.github/actions/acceptance-setup"]
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]

  # Python: pyproject.toml + uv.lock (the uv ecosystem updates the lock file too).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      python-major:
        applies-to: version-updates
        update-types: ["major"]
    ignore:
      # Second guard for the onnxruntime<1.24 ceiling in pyproject.toml (1.24+ cannot install on
      # macOS 13 or Intel Macs): without it Dependabot would widen that ceiling. It also blocks
      # security PRs above 1.23; the held-back-deps workflow (make audit-held-back) covers that.
      # The floor and every place that states it: docs/development/packaging.md.
      # No pandas rule: lifelines>=0.30.3 in pyproject.toml already makes pandas 3 unresolvable.
      - dependency-name: "onnxruntime"
        versions: [">=1.24"]

  # Electron desktop shell: electron/package.json + package-lock.json.
  - package-ecosystem: "npm"
    directory: "/electron"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      npm-major:
        applies-to: version-updates
        update-types: ["major"]
