# Shared setup for every job that runs the app or its tests (ci.yml: tests-fast,
# electron-playwright, smoke-installed, coverage; and, through acceptance-setup, the acceptance
# jobs). The job checks out the code first; this action does the rest. Change uv or the
# embedding-model cache here, once.
name: App setup
description: Install uv and the app's dependencies, and fetch the pinned embedding model through its cache.
runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      with:
        version: ">=0.5.0"

    - name: Install dependencies
      shell: bash
      run: uv sync --extra dev --group dev

    - name: Cache bundled embedding model
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: src/clinical_analytics/resources/models/all-MiniLM-L6-v2
        # core/embeddings.py holds MODEL_REVISION and the file hashes: bumping it changes the key.
        key: embedding-model-${{ hashFiles('src/clinical_analytics/core/embeddings.py') }}

    - name: Fetch bundled embedding model (pinned, SHA-256 checked; skips verified files)
      shell: bash
      run: make fetch-embedding-model
