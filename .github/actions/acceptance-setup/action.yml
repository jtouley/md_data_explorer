# Setup for the jobs that run the app on public corpus data (ci.yml: acceptance;
# acceptance-nightly.yml: acceptance-model). The job checks out the code first; this action
# does the rest.
name: Acceptance setup
description: The app setup (setup-app), plus the corpus download cache.
runs:
  using: composite
  steps:
    - name: Set up the app
      uses: ./.github/actions/setup-app

    - name: Cache public corpus downloads
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/mdde-bench
        # corpus.yaml pins every file's sha256, so a new checksum is a new key. On a cache hit the
        # fetcher still checks each file against its pin and stops on a mismatch.
        key: corpus-${{ hashFiles('src/clinical_analytics/eval/corpus/corpus.yaml') }}
