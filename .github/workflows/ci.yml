name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Read-only token for every job; no job here writes to the repository. A job that needs more
# gets its own `permissions:` block, which replaces this one for that job (list contents: read
# again there if it still checks out the code).
permissions:
  contents: read

# The Python every job installs. uv would otherwise pick whatever the runner image offers, so
# CI could drift from the 3.13 developers use (uv.lock still resolves some packages, e.g. scipy,
# differently on 3.11).
env:
  UV_PYTHON: "3.13"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the evaluation-token check diffs against the merge base with origin/main.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ">=0.5.0"

      - name: Install dependencies
        run: uv sync --extra dev --group dev

      - name: Lint
        run: make lint

      - name: Format Check
        run: make format-check

      - name: No tracked data files
        run: make check-data

      - name: SPDX headers
        run: make check-spdx

      # Lines added since origin/main must not name an evaluation-dataset identifier
      # (config/eval_token_hashes.txt holds salted hashes; matches print file:line only).
      - name: No evaluation tokens in added lines
        run: make check-eval-tokens

      # The hash list must not flag ordinary merged work: replay recent main commits through it.
      - name: Evaluation-token list passes recent main commits
        run: make check-eval-token-replay

      - name: onnxruntime lock covers macOS 13
        run: make check-lock-platforms

      - name: Type Check
        run: make type-check

  tests-fast:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the app
        uses: ./.github/actions/setup-app

      - name: Fast test suite
        run: make test-fast

  electron-playwright:
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.57 cannot install Chromium on.
    # Move back to ubuntu-latest when @playwright/test is upgraded to a release that supports it.
    runs-on: ubuntu-24.04
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the app
        uses: ./.github/actions/setup-app

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Electron 43 and its installer (@electron/get 5) need Node >= 22.12 (electron/package.json engines).
          node-version: "22"
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install npm dependencies
        working-directory: electron
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: electron
        run: npx playwright install --with-deps chromium

      - name: Electron quality gate (renderer + native harness)
        working-directory: electron
        env:
          CI: true
        run: xvfb-run -a npm run test:quality

  smoke-installed:
    # Wheel installed outside the repo, API started from another cwd, upload + query. Runs
    # in a network namespace (loopback only) where the runner allows unprivileged ones.
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the app
        uses: ./.github/actions/setup-app

      - name: Installed-wheel smoke test
        run: make smoke-installed

  coverage:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the app
        uses: ./.github/actions/setup-app

      - name: Run Coverage Check
        run: make test-cov-check

      - name: Check Coverage Regression
        run: make test-cov-diff

      - name: Upload Coverage Report
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.json
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Real public data through the real upload API, from a fresh app (docs/vision/PURPOSE.md).
  # Downloads: physionet.org (COVID-MS, CC-BY-4.0), each file pinned by sha256 in corpus.yaml.
  # The nightly run with a model is in acceptance-nightly.yml.
  acceptance:
    name: Acceptance on COVID-MS, no model
    runs-on: ubuntu-latest
    needs: quality
    # Normal run: about 5 minutes of setup, under 1 of questions (each takes 0.5-2 s without a
    # model), under 1 of upload check. Worst case, so the job ends with its table instead of
    # being cancelled: every question slow but finishing costs 2 x ACCEPT_TIMEOUT (the harness
    # waits once more for a timed-out query; a query still running after that makes later
    # questions ERROR after a short grace), so 15 questions x 120 s = 30 minutes, plus 5 of
    # setup and two app starts (300 s health limit each). Raise this with the question count.
    # Not covered: an upload request that stalls (the harness allows each 900 s); that ends in
    # a cancelled job, not a pass.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the app and the corpus cache
        id: setup
        uses: ./.github/actions/acceptance-setup

      # Fails on any WRONG, LEAK or ERROR, and when answered right falls below the committed
      # baseline (one aggregate count). The table goes to the job summary and an artifact.
      - name: Ask the COVID-MS questions and check the gate
        run: >-
          make accept DATASET=covid_ms MODEL=none ACCEPT_TIMEOUT=60
          ACCEPT_ARGS="--label ci --fail-on WRONG,LEAK,ERROR
          --baseline tests/eval/corpus/baselines/covid_ms.none.json
          --results-dir $RUNNER_TEMP/accept-results --summary $GITHUB_STEP_SUMMARY"

      # Uploads each dataset in ACCEPT_LOAD_DATASETS (Makefile) into its own fresh app and checks
      # status, rows and columns against corpus.yaml. Runs even when the questions failed, so
      # both results reach the summary; adding a dataset is a change to that one Makefile line.
      - name: Upload each corpus dataset and check the load
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: make accept-load ACCEPT_ARGS="--summary $GITHUB_STEP_SUMMARY"

      - name: Upload the results table
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-covid_ms-none
          # The markdown table only (grades, tiers, latencies, reasons), not results.json.
          path: ${{ runner.temp }}/accept-results/*/results.md
          # warn: a run that stopped before grading (exit 2) has no table, and its own step already
          # names why; an error here would add a second, misleading failure.
          if-no-files-found: warn
          retention-days: 30
