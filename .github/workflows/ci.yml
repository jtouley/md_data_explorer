name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Read-only token for every job; no job here writes to the repository. A job that needs more
# gets its own `permissions:` block, which replaces this one for that job (list contents: read
# again there if it still checks out the code).
permissions:
  contents: read

# The Python every job installs. uv would otherwise pick whatever the runner image offers, so
# CI could drift from the 3.13 developers use (uv.lock still resolves some packages, e.g. scipy,
# differently on 3.11).
env:
  UV_PYTHON: "3.13"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ">=0.5.0"

      - name: Install dependencies
        run: uv sync --extra dev --group dev

      - name: Lint
        run: make lint

      - name: Format Check
        run: make format-check

      - name: No tracked data files
        run: make check-data

      - name: SPDX headers
        run: make check-spdx

      - name: Type Check
        run: make type-check

  tests-fast:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ">=0.5.0"

      - name: Install dependencies
        run: uv sync --extra dev --group dev

      - name: Cache bundled embedding model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: src/clinical_analytics/resources/models/all-MiniLM-L6-v2
          # core/embeddings.py holds MODEL_REVISION and the file hashes: bumping it changes the key.
          key: embedding-model-${{ hashFiles('src/clinical_analytics/core/embeddings.py') }}

      - name: Fetch bundled embedding model (pinned, SHA-256 checked; skips verified files)
        run: make fetch-embedding-model

      - name: Fast test suite
        run: make test-fast

  electron-playwright:
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.57 cannot install Chromium on.
    # Move back to ubuntu-latest when @playwright/test is upgraded to a release that supports it.
    runs-on: ubuntu-24.04
    needs: quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ">=0.5.0"

      - name: Install Python dependencies
        run: uv sync --extra dev --group dev

      - name: Cache bundled embedding model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: src/clinical_analytics/resources/models/all-MiniLM-L6-v2
          # core/embeddings.py holds MODEL_REVISION and the file hashes: bumping it changes the key.
          key: embedding-model-${{ hashFiles('src/clinical_analytics/core/embeddings.py') }}

      - name: Fetch bundled embedding model (pinned, SHA-256 checked; skips verified files)
        run: make fetch-embedding-model

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Electron 43 and its installer (@electron/get 5) need Node >= 22.12 (electron/package.json engines).
          node-version: "22"
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install npm dependencies
        working-directory: electron
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: electron
        run: npx playwright install --with-deps chromium

      - name: Electron quality gate (renderer + native harness)
        working-directory: electron
        env:
          CI: true
        run: xvfb-run -a npm run test:quality

  smoke-installed:
    # Wheel installed outside the repo, API started from another cwd, upload + query. Runs
    # in a network namespace (loopback only) where the runner allows unprivileged ones.
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ">=0.5.0"

      - name: Install dependencies
        run: uv sync --extra dev --group dev

      - name: Cache bundled embedding model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: src/clinical_analytics/resources/models/all-MiniLM-L6-v2
          # core/embeddings.py holds MODEL_REVISION and the file hashes: bumping it changes the key.
          key: embedding-model-${{ hashFiles('src/clinical_analytics/core/embeddings.py') }}

      - name: Fetch bundled embedding model (pinned, SHA-256 checked; skips verified files)
        run: make fetch-embedding-model

      - name: Installed-wheel smoke test
        run: make smoke-installed

  coverage:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ">=0.5.0"

      - name: Install dependencies
        run: uv sync --extra dev --group dev

      - name: Cache bundled embedding model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: src/clinical_analytics/resources/models/all-MiniLM-L6-v2
          # core/embeddings.py holds MODEL_REVISION and the file hashes: bumping it changes the key.
          key: embedding-model-${{ hashFiles('src/clinical_analytics/core/embeddings.py') }}

      - name: Fetch bundled embedding model (pinned, SHA-256 checked; skips verified files)
        run: make fetch-embedding-model

      - name: Run Coverage Check
        run: make test-cov-check

      - name: Check Coverage Regression
        run: make test-cov-diff

      - name: Upload Coverage Report
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: coverage.json
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
