name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ">=0.5.0"

      - name: Install dependencies
        run: uv sync --extra dev --group dev

      - name: Lint
        run: make lint

      - name: Format Check
        run: make format-check

      - name: No tracked data files
        run: make check-data

      - name: Type Check
        run: make type-check

  tests-fast:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ">=0.5.0"

      - name: Install dependencies
        run: uv sync --extra dev --group dev

      - name: Cache bundled embedding model
        uses: actions/cache@v4
        with:
          path: src/clinical_analytics/resources/models/all-MiniLM-L6-v2
          # core/embeddings.py holds MODEL_REVISION and the file hashes: bumping it changes the key.
          key: embedding-model-${{ hashFiles('src/clinical_analytics/core/embeddings.py') }}

      - name: Fetch bundled embedding model (pinned, SHA-256 checked; skips verified files)
        run: make fetch-embedding-model

      - name: Fast test suite
        run: make test-fast

  electron-playwright:
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.57 cannot install Chromium on.
    # Move back to ubuntu-latest when @playwright/test is upgraded to a release that supports it.
    runs-on: ubuntu-24.04
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ">=0.5.0"

      - name: Install Python dependencies
        run: uv sync --extra dev --group dev

      - name: Cache bundled embedding model
        uses: actions/cache@v4
        with:
          path: src/clinical_analytics/resources/models/all-MiniLM-L6-v2
          # core/embeddings.py holds MODEL_REVISION and the file hashes: bumping it changes the key.
          key: embedding-model-${{ hashFiles('src/clinical_analytics/core/embeddings.py') }}

      - name: Fetch bundled embedding model (pinned, SHA-256 checked; skips verified files)
        run: make fetch-embedding-model

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install npm dependencies
        working-directory: electron
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: electron
        run: npx playwright install --with-deps chromium

      - name: Electron quality gate (renderer + native harness)
        working-directory: electron
        env:
          CI: true
        run: xvfb-run -a npm run test:quality

  smoke-installed:
    # Wheel installed outside the repo, API started from another cwd, upload + query. Runs
    # in a network namespace (loopback only) where the runner allows unprivileged ones.
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ">=0.5.0"

      - name: Install dependencies
        run: uv sync --extra dev --group dev

      - name: Cache bundled embedding model
        uses: actions/cache@v4
        with:
          path: src/clinical_analytics/resources/models/all-MiniLM-L6-v2
          # core/embeddings.py holds MODEL_REVISION and the file hashes: bumping it changes the key.
          key: embedding-model-${{ hashFiles('src/clinical_analytics/core/embeddings.py') }}

      - name: Fetch bundled embedding model (pinned, SHA-256 checked; skips verified files)
        run: make fetch-embedding-model

      - name: Installed-wheel smoke test
        run: make smoke-installed

  coverage:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ">=0.5.0"

      - name: Install dependencies
        run: uv sync --extra dev --group dev

      - name: Cache bundled embedding model
        uses: actions/cache@v4
        with:
          path: src/clinical_analytics/resources/models/all-MiniLM-L6-v2
          # core/embeddings.py holds MODEL_REVISION and the file hashes: bumping it changes the key.
          key: embedding-model-${{ hashFiles('src/clinical_analytics/core/embeddings.py') }}

      - name: Fetch bundled embedding model (pinned, SHA-256 checked; skips verified files)
        run: make fetch-embedding-model

      - name: Run Coverage Check
        run: make test-cov-check

      - name: Check Coverage Regression
        run: make test-cov-diff

      - name: Upload Coverage Report
        uses: codecov/codecov-action@v4
        with:
          files: coverage.json
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
