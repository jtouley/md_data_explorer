name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ">=0.5.0"

      - name: Install dependencies
        run: uv sync --extra dev --group dev

      - name: Lint
        run: make lint

      - name: Format Check
        run: make format-check

      - name: Type Check
        run: make type-check

  tests-fast:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ">=0.5.0"

      - name: Install dependencies
        run: uv sync --extra dev --group dev

      - name: Fast test suite
        run: make test-fast

  electron-playwright:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install npm dependencies
        working-directory: electron
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: electron
        run: npx playwright install --with-deps chromium

      - name: Electron renderer Playwright
        working-directory: electron
        env:
          CI: true
        run: npm run test:e2e

  coverage:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ">=0.5.0"

      - name: Install dependencies
        run: uv sync --extra dev --group dev

      - name: Run Coverage Check
        run: make test-cov-check

      - name: Check Coverage Regression
        run: make test-cov-diff

      - name: Upload Coverage Report
        uses: codecov/codecov-action@v4
        with:
          files: coverage.json
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
