name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # Nightly: acceptance with a local model (acceptance-model). The other jobs run too.
  schedule:
    - cron: "23 9 * * *"
  # Manual run (Actions tab, write access): same jobs as the nightly. Takes no inputs.
  workflow_dispatch:

# Read-only token for every job; no job here writes to the repository. A job that needs more
# gets its own `permissions:` block, which replaces this one for that job (list contents: read
# again there if it still checks out the code).
permissions:
  contents: read

# The Python every job installs. uv would otherwise pick whatever the runner image offers, so
# CI could drift from the 3.13 developers use (uv.lock still resolves some packages, e.g. scipy,
# differently on 3.11).
env:
  UV_PYTHON: "3.13"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ">=0.5.0"

      - name: Install dependencies
        run: uv sync --extra dev --group dev

      - name: Lint
        run: make lint

      - name: Format Check
        run: make format-check

      - name: No tracked data files
        run: make check-data

      - name: SPDX headers
        run: make check-spdx

      - name: Type Check
        run: make type-check

  tests-fast:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ">=0.5.0"

      - name: Install dependencies
        run: uv sync --extra dev --group dev

      - name: Cache bundled embedding model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: src/clinical_analytics/resources/models/all-MiniLM-L6-v2
          # core/embeddings.py holds MODEL_REVISION and the file hashes: bumping it changes the key.
          key: embedding-model-${{ hashFiles('src/clinical_analytics/core/embeddings.py') }}

      - name: Fetch bundled embedding model (pinned, SHA-256 checked; skips verified files)
        run: make fetch-embedding-model

      - name: Fast test suite
        run: make test-fast

  electron-playwright:
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.57 cannot install Chromium on.
    # Move back to ubuntu-latest when @playwright/test is upgraded to a release that supports it.
    runs-on: ubuntu-24.04
    needs: quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ">=0.5.0"

      - name: Install Python dependencies
        run: uv sync --extra dev --group dev

      - name: Cache bundled embedding model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: src/clinical_analytics/resources/models/all-MiniLM-L6-v2
          # core/embeddings.py holds MODEL_REVISION and the file hashes: bumping it changes the key.
          key: embedding-model-${{ hashFiles('src/clinical_analytics/core/embeddings.py') }}

      - name: Fetch bundled embedding model (pinned, SHA-256 checked; skips verified files)
        run: make fetch-embedding-model

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Electron 43 and its installer (@electron/get 5) need Node >= 22.12 (electron/package.json engines).
          node-version: "22"
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install npm dependencies
        working-directory: electron
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: electron
        run: npx playwright install --with-deps chromium

      - name: Electron quality gate (renderer + native harness)
        working-directory: electron
        env:
          CI: true
        run: xvfb-run -a npm run test:quality

  smoke-installed:
    # Wheel installed outside the repo, API started from another cwd, upload + query. Runs
    # in a network namespace (loopback only) where the runner allows unprivileged ones.
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ">=0.5.0"

      - name: Install dependencies
        run: uv sync --extra dev --group dev

      - name: Cache bundled embedding model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: src/clinical_analytics/resources/models/all-MiniLM-L6-v2
          # core/embeddings.py holds MODEL_REVISION and the file hashes: bumping it changes the key.
          key: embedding-model-${{ hashFiles('src/clinical_analytics/core/embeddings.py') }}

      - name: Fetch bundled embedding model (pinned, SHA-256 checked; skips verified files)
        run: make fetch-embedding-model

      - name: Installed-wheel smoke test
        run: make smoke-installed

  coverage:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ">=0.5.0"

      - name: Install dependencies
        run: uv sync --extra dev --group dev

      - name: Cache bundled embedding model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: src/clinical_analytics/resources/models/all-MiniLM-L6-v2
          # core/embeddings.py holds MODEL_REVISION and the file hashes: bumping it changes the key.
          key: embedding-model-${{ hashFiles('src/clinical_analytics/core/embeddings.py') }}

      - name: Fetch bundled embedding model (pinned, SHA-256 checked; skips verified files)
        run: make fetch-embedding-model

      - name: Run Coverage Check
        run: make test-cov-check

      - name: Check Coverage Regression
        run: make test-cov-diff

      - name: Upload Coverage Report
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: coverage.json
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Real public data through the real upload API, from a fresh app (docs/vision/PURPOSE.md).
  # Downloads: physionet.org (COVID-MS, CC-BY-4.0), each file pinned by sha256 in corpus.yaml.
  acceptance:
    name: Acceptance on COVID-MS, no model
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up the app and the corpus cache
        uses: ./.github/actions/acceptance-setup

      # Fails on any WRONG, LEAK or ERROR, and when answered right falls below the committed
      # baseline (one aggregate count). The table goes to the job summary and an artifact.
      - name: Ask the COVID-MS questions and check the gate
        run: >-
          make accept DATASET=covid_ms MODEL=none
          ACCEPT_ARGS="--label ci --fail-on WRONG,LEAK,ERROR
          --baseline tests/eval/corpus/baselines/covid_ms.none.json
          --results-dir $RUNNER_TEMP/accept-results --summary $GITHUB_STEP_SUMMARY"

      - name: Upload the results table
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acceptance-covid_ms-none
          # The markdown table only (grades, tiers, latencies, reasons), not results.json.
          path: ${{ runner.temp }}/accept-results/*/results.md
          if-no-files-found: error
          retention-days: 30

  corpus-load:
    # Uploads each dataset in ACCEPT_LOAD_DATASETS (Makefile) into its own fresh app and checks
    # status, rows and columns against corpus.yaml. Adding a dataset is a change to that one line.
    name: Corpus upload check
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up the app and the corpus cache
        uses: ./.github/actions/acceptance-setup

      - name: Upload each corpus dataset and check the load
        run: make accept-load ACCEPT_ARGS="--summary $GITHUB_STEP_SUMMARY"

  acceptance-model:
    # Nightly and manual runs only. Ollama runs from an image pinned by digest (no install
    # script), listening on loopback only. The model's manifest digest is checked before any
    # question is asked.
    name: Acceptance on COVID-MS, llama3.2:3b (nightly)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 150
    env:
      # ollama/ollama:0.40.13, multi-arch index digest. Change the digest and this version together.
      OLLAMA_IMAGE: ollama/ollama@sha256:b2f0122c476bc9fe7ce679d8bb4bd555351e25e2554eefb156f61cb0a89cf429
      OLLAMA_MODEL: llama3.2:3b
      # sha256 of the model's manifest on registry.ollama.ai (`ollama list` shows a80c4f17acd5).
      OLLAMA_MODEL_DIGEST: a80c4f17acd55265feec403c7aef86be0c25983ab279d83f3bcd3abbcb5b8b72
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up the app and the corpus cache
        uses: ./.github/actions/acceptance-setup

      - name: Start Ollama
        run: |
          docker run --detach --name ollama --publish 127.0.0.1:11434:11434 "$OLLAMA_IMAGE"
          for _ in $(seq 1 60); do
            curl --silent --fail http://127.0.0.1:11434/api/version && exit 0
            sleep 2
          done
          echo "::error::Ollama did not answer on 127.0.0.1:11434 within 120 seconds. Its log follows; check that the image digest still exists."
          docker logs ollama
          exit 1

      - name: Pull the model and check its digest
        run: |
          curl --silent --show-error --fail --max-time 1800 http://127.0.0.1:11434/api/pull \
            --data "{\"model\": \"$OLLAMA_MODEL\", \"stream\": false}"
          actual=$(curl --silent --show-error --fail http://127.0.0.1:11434/api/tags \
            | jq --raw-output --arg m "$OLLAMA_MODEL" '.models[] | select(.name == $m) | .digest')
          if [ "$actual" != "$OLLAMA_MODEL_DIGEST" ]; then
            echo "::error::$OLLAMA_MODEL has digest '$actual', expected $OLLAMA_MODEL_DIGEST. The tag now points at a different model: run it locally first, then update OLLAMA_MODEL_DIGEST."
            exit 1
          fi

      # Fails on any WRONG or LEAK. An ERROR (a timeout, or a silent fall back from the model) is
      # in the table but does not fail the nightly. The table shows the tier that answered each
      # question, whether the model ran, and the latency.
      - name: Ask the COVID-MS questions with the model and check the gate
        run: >-
          make accept DATASET=covid_ms MODEL="$OLLAMA_MODEL" ACCEPT_TIMEOUT=360
          ACCEPT_ARGS="--label nightly --fail-on WRONG,LEAK --llm-timeout 180
          --results-dir $RUNNER_TEMP/accept-results --summary $GITHUB_STEP_SUMMARY"

      - name: Upload the results table
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acceptance-covid_ms-llama3.2-3b
          path: ${{ runner.temp }}/accept-results/*/results.md
          if-no-files-found: error
          retention-days: 30
