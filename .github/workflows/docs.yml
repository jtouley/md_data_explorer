name: Deploy Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # mkdocs gh-deploy pushes the built site to the gh-pages branch.
    permissions:
      contents: write
    steps:
      # Credentials stay persisted: gh-deploy pushes with them. No artifact is uploaded.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0 # zizmor: ignore[artipacked]
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ">=0.5.0"
          # requires-python is ">=3.11,<3.14"; build with the newest supported release.
          python-version: "3.13"
          # No shared cache in the one job that holds a write token: a poisoned cache entry would
          # run with it. The install is small (docs tooling only).
          enable-cache: false

      # mkdocs and its plugins come from the dev group in uv.lock (exact versions and hashes).
      # --frozen fails if the lock is out of date instead of resolving fresh versions;
      # --only-group skips the app itself: mkdocstrings reads src/ statically (mkdocs.yml paths).
      - name: Install docs tooling from the lock file
        run: uv sync --frozen --only-group dev

      - name: Deploy documentation
        # --no-sync: run what was just installed, do not re-resolve or install the project.
        run: uv run --frozen --no-sync mkdocs gh-deploy --force
