name: Deploy Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # mkdocs gh-deploy pushes the built site to the gh-pages branch.
    permissions:
      contents: write
    steps:
      # Credentials stay persisted: gh-deploy pushes with them. No artifact is uploaded.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 # zizmor: ignore[artipacked]
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install mkdocs mkdocs-material "mkdocstrings[python]" mkdocs-mermaid2-plugin pymdown-extensions

      - name: Deploy documentation
        run: mkdocs gh-deploy --force
