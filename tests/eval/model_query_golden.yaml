# Golden samples for the model-written query path (src/clinical_analytics/model_query).
#
# Each sample replays plan replies in the shape the local model gives (the slots of
# plan.reply_schema) through the real check-compile-execute layer on a synthetic table from
# tests/model_query/tables.py: no model runs here. `oracle` names a Polars oracle in the test
# module that recomputes the expected value independently; `status` is the expected outcome.
#
# Fields:
#   table:    clinic | cohort
#   replies:  the model's replies in order (more than one: the first was fed back)
#   status:   answered | clarify | refused
#   oracle:   (answered) the oracle of the answer's headline value
#   reading:  lines the reading card must contain
samples:
  - id: cohort-total
    table: cohort
    question: How many patients are in this file?
    replies: [{answer: count, count_of: patients, filters: [], numerator: [], measure: null, group_by: null, period: none, cut_points: [], which_visit: any}]
    status: answered
    oracle: cohort_total
    reading: ["Counted: patients, one record each.", "Included: everyone in the file."]
  - id: cohort-under-65-inverted
    table: cohort
    question: How many patients are under 65?
    replies: [{answer: count, count_of: patients, filters: [{column: age, op: ">=", value: 65, values: []}], numerator: [], measure: null, group_by: null, period: none, cut_points: [], which_visit: any}]
    status: answered
    oracle: cohort_under_65
    reading: ["Included: age in years at surgery under 65 years."]
  - id: cohort-not-died-share
    table: cohort
    question: What share of stage III patients did not die within a year?
    replies: [{answer: share, count_of: patients, filters: [{column: stage, op: is, value: null, values: [III]}], numerator: [{column: died_1y, op: is, value: null, values: ["no"]}], measure: null, group_by: null, period: none, cut_points: [], which_visit: any}]
    status: answered
    oracle: cohort_stage3_alive_share
  - id: cohort-dropped-threshold-fed-back
    table: cohort
    question: How many patients over 70 have stage II?
    replies:
      - {answer: count, count_of: patients, filters: [{column: stage, op: is, value: null, values: [II]}], numerator: [], measure: null, group_by: null, period: none, cut_points: [], which_visit: any}
      - {answer: count, count_of: patients, filters: [{column: stage, op: is, value: null, values: [II]}, {column: age, op: ">", value: 70, values: []}], numerator: [], measure: null, group_by: null, period: none, cut_points: [], which_visit: any}
    status: answered
    oracle: cohort_over70_stage2
  - id: clinic-latest-arm
    table: clinic
    question: How many patients are on each arm at their latest visit?
    replies: [{answer: count, count_of: patients, filters: [], numerator: [], measure: null, group_by: arm, period: none, cut_points: [], which_visit: any}]
    status: answered
    oracle: clinic_latest_arm
    reading: ["Counted: patients, each once, read at their latest clinic visit with it recorded."]
  - id: clinic-never-smoked
    table: clinic
    question: How many patients never smoked?
    replies: [{answer: count, count_of: patients, filters: [{column: smoker, op: is, value: null, values: ["no"]}], numerator: [], measure: null, group_by: null, period: none, cut_points: [], which_visit: any}]
    status: answered
    oracle: clinic_never_smoked
  - id: clinic-baseline-bp
    table: clinic
    question: Average systolic pressure at baseline?
    replies: [{answer: mean, count_of: patients, filters: [], numerator: [], measure: systolic_mmhg, group_by: null, period: none, cut_points: [], which_visit: any}]
    status: answered
    oracle: clinic_baseline_bp
  - id: clinic-visit-unstated-asks
    table: clinic
    question: How many patients smoke?
    replies: [{answer: count, count_of: patients, filters: [{column: smoker, op: is, value: null, values: ["yes"]}], numerator: [], measure: null, group_by: null, period: none, cut_points: [], which_visit: last}]
    status: clarify
  - id: clinic-unit-unstated-asks
    table: clinic
    question: What share smoked at the latest visit?
    replies: [{answer: share, count_of: patients, filters: [], numerator: [{column: smoker, op: is, value: null, values: ["yes"]}], measure: null, group_by: null, period: none, cut_points: [], which_visit: last}]
    status: clarify
