[project]
name = "clinical-analytics"
version = "0.1.0"
description = "Multi-dataset clinical analytics platform"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/*.txt"]
requires-python = ">=3.11,<3.14"
authors = [{ name = "Jason Touleyrou", email = "jtouley@gmail.com" }]
dependencies = [
    "pandas>=2.1.0",
    # Upper bounds on the majors this lock was tested with (Polars 2, Starlette 1, Pillow 13).
    # dataset_version no longer depends on the Polars version (storage/versioning.py), but a new
    # major still needs a deliberate bump and a full test run.
    "polars>=2.1,<3",
    # One numpy on every supported Python: numpy 2.5 needs Python >= 3.12 and we support 3.11,
    # so without this cap the lock splits (2.4 on 3.11, 2.5 on 3.12+) and CI tests one of them.
    "numpy>=2.4.6,<2.5",
    # DuckDB 2.0 LTS (supported to 2027-10-22; 1.4 LTS ends 2026-11-17, duckdb.org/release_calendar).
    # <2.1: Ibis 12 still calls DuckDBPyRelation.fetch_arrow_table, deprecated in 2.0.
    "duckdb>=2.0.0,<2.1",
    # Ibis 12.0.0 is the newest release (2026-11-03). Some of its DuckDB calls are broken on 2.0
    # (ibis#12196, fix in ibis#12206); tests/core/test_ibis_duckdb_compat.py keeps the app off them.
    "ibis-framework[duckdb]>=12.0.0,<13",
    "statsmodels>=0.14.0",
    "pyyaml>=6.0",
    "lifelines>=0.27.0",
    "openpyxl>=3.1.0",  # Excel file support
    "pyreadstat>=1.2.0",  # SPSS file support
    "pymupdf>=1.23.0",  # PDF text extraction
    # Embeddings for semantic matching: the all-MiniLM-L6-v2 ONNX export run with ONNX Runtime
    # (core/embeddings.py). No torch: the model is bundled at build time (make fetch-embedding-model).
    # Pinned: newest release >= 2 weeks old with macOS 13 arm64 + x86_64 wheels for cp311-cp313
    # (1.24+ dropped Intel macOS and needs macOS 14). Supported minimum: macOS 13.
    "onnxruntime==1.31.1",
    "tokenizers>=0.22.1,<0.24",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "pillow>=13,<14",  # transitive via matplotlib (seaborn, lifelines); bounded to the tested major
    "langchain>=1.2.0",
    "langchain-community>=0.4.1",
    "structlog>=24.0.0",
    "tiktoken>=0.5.0",  # Accurate token counting for LLM context management
    # FastAPI backend dependencies (ADR010)
    "fastapi>=0.115.0",
    "starlette>=1.10,<2",  # transitive via fastapi and sse-starlette; bounded to the tested major
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sse-starlette>=2.2.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "python-multipart>=0.0.12",  # For form data / file uploads
    "open-data-contract-standard>=3.2.0,<3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=2.4.1,<3",
    "pre-commit>=3.5.0",
    "types-requests>=2.31.0",
    "types-PyYAML>=6.0.0",
    "mutmut>=3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The embedding model is gitignored (fetched by `make fetch-embedding-model`) but must ship.
# Set for every target, not only the wheel: a plain `uv build` makes the sdist first and builds
# the wheel from it, so a model missing from the sdist is missing from the wheel as well.
artifacts = ["src/clinical_analytics/resources/models/**"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# ERA: commented-out code, TD: TODO formatting, FIX: FIXME/HACK/XXX detection
select = ["E", "F", "I", "N", "W", "UP", "ERA", "TD", "FIX"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Test files use camelCase naming per CLAUDE.md: test_unit_scenario_expectedBehavior
# ERA001: AAA pattern comments (# Arrange:, # Act:, # Assert:) are standard test structure
# TD002, TD003, FIX002: TODOs in tests are acceptable as they indicate future improvements
"tests/**/*.py" = ["N802", "N806", "ERA001", "TD002", "TD003", "FIX002"]
# Scripts and UI pages need sys.path manipulation before imports
"scripts/**/*.py" = ["E402"]
"src/clinical_analytics/ui/**/*.py" = ["E402"]
"test_*.py" = ["E402"]
"tests/eval/**/*.py" = ["E402"]  # Eval scripts need sys.path manipulation

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (require external services)",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["src/clinical_analytics"]
branch = true
omit = ["*/__pycache__/*", "*/tests/*", "*/__init__.py", "*/ui/pages/*"]

[tool.coverage.report]
# Starting at 67% (current baseline) - target is 95%
fail_under = 67
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == \"__main__\":",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.performance]
# Regression thresholds (percentage increase)
individual_test_threshold = 20.0
suite_threshold = 15.0
slow_test_threshold_seconds = 30.0
baseline_file = "tests/.performance_baseline.json"
data_file = "tests/.performance_data.json"

[tool.uv.workspace]
members = [
    "docs",
]

[dependency-groups]
repo-context-mcp = [
    "mcp>=1.8.0",
]
dev = [
    "datacontract-cli>=1.2.9,<1.3",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.1",
    "mkdocs-mermaid2-plugin>=1.2.3",
    "mkdocstrings[python]>=1.0.0",
    "pymdown-extensions>=10.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
]

[tool.mutmut]
# Mutation testing (see `make mutation` / `make mutation-module`). Streamlit page scripts
# are excluded for the same reason they are excluded from coverage: they run at import time.
source_paths = ["src/clinical_analytics/"]
do_not_mutate = ["src/clinical_analytics/ui/pages/*", "*/__init__.py"]
also_copy = ["scripts/", "docs/", "Makefile", "README.md", "AGENT.md", "taskmaster.yaml", ".coveragerc", ".cursor/", ".claude/"]
pytest_add_cli_args_test_selection = ["tests/"]
# Each mutant pays ~15s of pytest collection; the 1s default budget misclassifies most as timeouts.
timeout_constant = 60
pytest_add_cli_args = ["-m", "not slow and not integration", "-p", "no:randomly", "-q"]
