    plan: {thought: "Share of people with doses equal to 3, per age_group.", answer: "share", where: null, group_by: "age_group", numerator: "doses = 3", number: null, outcome: null}
    sql: "SELECT age_group, AVG(CASE WHEN doses = 3 THEN 1.0 ELSE 0.0 END) AS rate FROM unified GROUP BY age_group"
  - table: vaccine
    question: "What share of each region had no documented dose and a titer below 10?"
    plan: {thought: "Share of people with doses 0 and antibody_titer below 10, per region.", answer: "share", where: null, group_by: "region", numerator: "doses = 0 AND antibody_titer < 10", number: null, outcome: null}
    sql: "SELECT region, AVG(CASE WHEN doses = 0 AND antibody_titer < 10 THEN 1.0 ELSE 0.0 END) AS rate FROM unified GROUP BY region"
