    plan: {thought: "Share of people with doses 0 and antibody_titer below 10, per region.", answer: "share", where: null, group_by: "region", numerator: "doses = 0 AND antibody_titer < 10", number: null, outcome: null}
    sql: "SELECT region, AVG(CASE WHEN doses = 0 AND antibody_titer < 10 THEN 1.0 ELSE 0.0 END) AS rate FROM unified GROUP BY region"
  - table: vaccine
    question: "Correlate antibody titer with number of doses."
    plan: {thought: "Correlation between antibody_titer and doses.", answer: "correlation", where: null, group_by: "doses", numerator: null, number: null, outcome: "antibody_titer"}
    sql: null
  - table: lipid
    question: "Mean LDL at each patient's first visit?"
    plan: {thought: "Each patient's first ldl, then the mean.", answer: "mean", where: null, group_by: null, numerator: null, number: "ldl", outcome: null, per_patient: "first", order_by: "visit_date"}
    sql: "SELECT AVG(ldl) AS mean FROM (SELECT patient_id, ARG_MIN(ldl, visit_date) AS ldl FROM unified GROUP BY patient_id)"
  - table: lipid
    question: "Typical number of clinic visits per patient?"
    plan: {thought: "Rows per patient, then the median.", answer: "median", where: null, group_by: null, numerator: null, number: null, outcome: null, per_patient: "count", order_by: null}
    sql: "SELECT MEDIAN(n) AS median FROM (SELECT patient_id, COUNT(*) AS n FROM unified GROUP BY patient_id)"
  - table: lipid
