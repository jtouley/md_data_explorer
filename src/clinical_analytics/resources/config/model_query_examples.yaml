# Worked examples for the model-writes-the-query path (model_query/examples.py).
#
# The few most similar questions are put in the model's prompt as question -> plan pairs. They are
# written on made-up tables (below), never on a user's data, and use column names no real or test
# dataset uses: they teach how a kind of question fills the plan's slots, not the answer to a
# particular one. Every plan shows every slot (the reply schema requires them all).
#
# tests/model_query/test_examples.py checks every plan is valid and uses only its table's columns.
tables:
  lens:
    text: >-
      Each record is one patient. Columns: chart_ref (the patient ID); yrs_at_op: number 41 to 93;
      gender: values 'woman', 'man'; lens_model: values 'monofocal', 'toric', 'multifocal';
      acuity_pre: number; acuity_post: number; surgical_issue: values 'none', 'capsule tear',
      'corneal edema'; op_day: date 2019-01-04 to 2024-12-20.
    columns: [chart_ref, yrs_at_op, gender, lens_model, acuity_pre, acuity_post, surgical_issue, op_day]
  ulcer:
    text: >-
      Each record is one wound-care visit; patients have several visits, ref_code names the patient.
      Visits are in the order of seq_in_course. Columns: ref_code (the patient ID); seq_in_course:
      number (numbers each patient's visits); seen_on: date 2021 to 2024; ulcer_kind: values
      'venous', 'arterial', 'diabetic foot'; wound_area: number cm2; wound_infected: values 'yes',
      'no'; closed: values 'yes', 'no'; yrs_old: number.
    columns: [ref_code, seq_in_course, seen_on, ulcer_kind, wound_area, wound_infected, closed, yrs_old]
  blood:
    text: >-
      Each record is one transfusion episode; patients have several episodes, person_ref names the
      patient. Columns: person_ref (the patient ID); given_on: date; hb_prior: number g/dL;
      packs_given: number; reacted: values 'Y', 'N'; service: values 'surgical', 'medical', 'critical care'.
    columns: [person_ref, given_on, hb_prior, packs_given, reacted, service]
  sleep:
    text: >-
      Each record is one patient. Columns: sleep_ref (the patient ID); apnea_index: number; body_mass:
      number kg/m2; loud_snoring: values 'Y', 'N'; pap_begun: values 'Y', 'N'; age_at_test: number.
    columns: [sleep_ref, apnea_index, body_mass, loud_snoring, pap_begun, age_at_test]
  tally:
    text: >-
      Each record counts packs handed out for one outlet zone, formulary and month. packs_out holds
      how many packs each record counts: a count adds it up. Columns: outlet_zone: values 'harbour',
      'ridge', 'upland'; formulary: values 'generic', 'branded'; tally_month: date 2023-01-01 to
      2024-12-01; packs_out: number.
    columns: [outlet_zone, formulary, tally_month, packs_out]
examples:
  - table: lens
    question: "How many patients are in the file?"
    plan: {answer: count, count_of: patients, filters: [], numerator: [], measure: null, group_by: [], period: none, cut_points: [], which_visit: any, totals_by: null, missing: null}
