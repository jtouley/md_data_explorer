    question: "How many women got a toric lens?"
    plan: {answer: count, count_of: patients, filters: [{column: gender, op: is, value: null, values: [woman]}, {column: lens_model, op: is, value: null, values: [toric]}], numerator: [], measure: null, group_by: [], period: none, cut_points: [], which_visit: any, totals_by: null, missing: null}
