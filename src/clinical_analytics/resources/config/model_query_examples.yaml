    plan: {thought: "Days between a patient's consecutive visit_date values, then the median.", answer: "median", where: null, group_by: null, numerator: null, number: "visit_date", outcome: null, per_patient: "gap_days", order_by: null}
    sql: "SELECT MEDIAN(d) AS median FROM (SELECT DATE_DIFF('day', LAG(visit_date) OVER (PARTITION BY patient_id ORDER BY visit_date), visit_date) AS d FROM unified) WHERE d IS NOT NULL"
  - table: lipid
    question: "Number of patients never put on a statin?"
    plan: {thought: "The condition for one visit is statin yes; the app checks it was true on none of a patient's visits.", answer: "count", where: "statin = 'yes'", group_by: null, numerator: null, number: null, outcome: null, per_patient: null, order_by: null}
