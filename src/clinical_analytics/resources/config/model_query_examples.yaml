    sql: "SELECT COUNT(*) AS count FROM (SELECT patient_id FROM unified GROUP BY patient_id HAVING BOOL_AND(ldl < 100))"
  - table: lipid
    question: "Patient counts in the age bands below 50, 50-69 and 70+?"
    plan: {thought: "Count patients by age; the app makes the stated bands.", answer: "count", where: null, group_by: "age", numerator: null, number: null, outcome: null, per_patient: null, order_by: null}
    sql: "SELECT CASE WHEN age < 50 THEN 'below 50' WHEN age <= 69 THEN '50-69' ELSE '70+' END AS age_band, COUNT(DISTINCT patient_id) AS count FROM unified GROUP BY 1"
