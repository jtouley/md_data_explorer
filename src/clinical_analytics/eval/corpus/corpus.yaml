        kind: table
        note: metastore id k2ze-bqvw
        sha256: 97433a18652a22e2b7390880b8f732f5e9c1ba8fcfb9fb2259bf69bced017cd2
        bytes: 101387
    dictionary_url: https://data.cms.gov/provider-data/dataset/77hc-ibv8
    upload_package:
      zip: cms_hai_hospital.zip
      sha256: e30e728d07949eda65d89ad4bc0fff25e953fc5404af88955fe5e22aa6a85002  # deterministic: sorted, stored, fixed metadata
      contents:
        - {name: Healthcare_Associated_Infections-Hospital.csv, from: Healthcare_Associated_Infections-Hospital.csv, make: copy}
        - {name: Healthcare_Associated_Infections-State.csv, from: Healthcare_Associated_Infections-State.csv, make: copy}

  - name: who_tb_burden
    title: WHO Global Tuberculosis Programme - TB burden estimates (country x year; age x sex)
    landing_page: https://www.who.int/teams/global-tuberculosis-programme/data
    license:
      id: WHO-Data-Terms
      url: https://www.who.int/about/policies/publishing/data-policy/terms-and-conditions
      terms: "Royalty-free right to use, reproduce, download and distribute for public-health purposes; must attribute 'WHO, title of dataset, year, date of access' plus reporting countries; no alteration beyond minimal reformatting without WHO permission; no sale; no de-anonymisation."
    grain: 'aggregate: country x year (2000-2024); age_sex: country x age group x sex x risk factor for the latest year only'
    rows: {countries: 5347, age_sex: 9031}
    id_column: iso3 + year
    missing_tokens: ["'NA'", blank]
    living: true
    files:
      - path: TB_burden_countries.csv
        url: https://extranet.who.int/tme/generateCSV.asp?ds=estimates
        kind: table
        sha256: 6849d50d91579eaefa5833aa46d19d34e68dd6408a3768875991013f05586c30
        bytes: 1053778
      - path: TB_burden_age_sex.csv
