        sha256: 2b0aecd442bffabf2f313d2eaa478ffaea48d09fe78670a136a1956c042011bf
        bytes: 108122
    dictionary_url: https://extranet.who.int/tme/generateCSV.asp?ds=dictionary
    upload_package:
