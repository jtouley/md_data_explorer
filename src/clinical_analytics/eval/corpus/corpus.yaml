    grain: patient (patno)
    rows: 502
    id_column: patno
    files:
      - path: prostate.xls
        url: https://hbiostat.org/data/repo/prostate.xls
        kind: table
        sha256: 432cae82966ce42e7ef2591df90ffda40952386b07af5ac58ffceed82f9a03a0
