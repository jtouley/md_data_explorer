  - name: mesothelioma_xlsx
    title: Mesothelioma's disease data set (UCI 351)
    landing_page: https://archive.ics.uci.edu/dataset/351/mesothelioma+s+disease+data+set
    license:
      id: CC-BY-4.0
      url: https://creativecommons.org/licenses/by/4.0/legalcode
      terms: Attribution required; cite UCI and Er et al. 2012.
    # Sheet "Data", then codebook sheets. From 'white blood' on, headers sit one column off the
