# Public datasets the acceptance harness (`make accept`) uploads through the real upload path.
# Field names follow the corpus manifest (name, files[].path/url/sha256/bytes/kind, license,
# upload_package). Files are fetched into a cache outside the repo and checked by sha256; no
# data is ever committed (scripts/check_no_data_files.py).
datasets:
  - name: covid_ms
    title: COVID-19 and Multiple Sclerosis Global Data Sharing Initiative (GDSI) open dataset v1.0.1
    landing_page: https://physionet.org/content/patient-level-data-covid-ms/1.0.1/
    doi: https://doi.org/10.13026/77ta-1866
    license:
      id: CC-BY-4.0
      url: https://creativecommons.org/licenses/by/4.0/legalcode
      text_url: https://physionet.org/files/patient-level-data-covid-ms/1.0.1/LICENSE.txt
      terms: Attribution required; cite Khan et al. (PhysioNet 2024) and Goldberger et al. (2000). No DUA.
    grain: patient (one row per person with MS reporting COVID-19)
    rows: 1141
    id_column: secret_name
    files:
      - path: GDSI_OpenDataset_Final.csv
        url: https://physionet.org/files/patient-level-data-covid-ms/1.0.1/GDSI_OpenDataset_Final.csv?download
        kind: table
        sha256: 8aafa48e4f5a4db9d1a15924317dce94745ea56b59e9b7cc7be2bfc4ecb97498
        bytes: 226488
      - path: README.txt
        url: https://physionet.org/files/patient-level-data-covid-ms/1.0.1/README.txt?download
        kind: documentation
        sha256: a59bce57e26f71ad7be502faaa935b6d115dfc0725512e1c982749bf2195f0e8
        bytes: 1499
      - path: LICENSE.txt
        url: https://physionet.org/files/patient-level-data-covid-ms/1.0.1/LICENSE.txt?download
        kind: license
        sha256: 9a78e7f22742dde9f66ae235ec793ba2212019dc4d0ced75c4da09ced0b35fb2
        bytes: 14842
      # PhysioNet publishes no dictionary file: the variable descriptions are the "Data
      # Description" section of the project page. The live page is not a stable artifact (view
      # counts, "Cited by", site template), so only that section's plain text is kept and pinned.
      - path: data_description.txt
        url: https://physionet.org/content/patient-level-data-covid-ms/1.0.1/
        kind: dictionary
        extract_section: description
        sha256: 68abce896b33058d9112a180e1a9e23dd9825ec9f5f95143e6f67a2380d77a41
        bytes: 13808
    dictionary_url: https://physionet.org/content/patient-level-data-covid-ms/1.0.1/
    upload_package:
      zip: covid_ms.zip
      # archive name -> source file path (copied as fetched and checked)
      contents:
        - {name: GDSI_OpenDataset_Final.csv, from: GDSI_OpenDataset_Final.csv, make: copy}
        - {name: README.txt, from: README.txt, make: copy}
        - {name: LICENSE.txt, from: LICENSE.txt, make: copy}
        - {name: data_dictionary.txt, from: data_description.txt, make: copy}
      sha256: a3639ebca2068df992230516e3608924daed23ca2be7532cd978a14e6ecae7ae  # deterministic: sorted, stored, fixed metadata

  # ---- Population (aggregate) datasets. Each row is a published estimate for a place x period
  # x stratum, not a patient. All are republished by their source (living: true): a checksum
  # mismatch means the source was refreshed; re-snapshot and re-baseline the answers. The corpus
  # manifest records no dictionary file for the CDC and CMS sets; their column descriptions are on
  # the landing page (dictionary_url).
  - name: cdc_leading_causes_death
    title: 'NCHS - Leading Causes of Death: United States (1999-2017)'
    landing_page: https://data.cdc.gov/NCHS/NCHS-Leading-Causes-of-Death-United-States/bi63-dtpu
    license:
      id: US-Government-Public-Domain
      url: https://www.usa.gov/government-works
      terms: 'Public domain (U.S. Government work). Cite NCHS. Note: the old dataset id bi63-vtsv now returns 404; use bi63-dtpu.'
    grain: 'aggregate: state x year x cause'
    rows: 10868
    id_column: composite key (Year, State, Cause Name)
    living: true
    files:
      - path: leading_causes_of_death.csv
        url: https://data.cdc.gov/api/views/bi63-dtpu/rows.csv?accessType=DOWNLOAD
        kind: table
        sha256: 1971e6664c76457a5c32e4c86aa103ba404b7be5d17ddb6e6dfc0075479c85d9
        bytes: 842709
    dictionary_url: https://data.cdc.gov/NCHS/NCHS-Leading-Causes-of-Death-United-States/bi63-dtpu
    upload_package:
      zip: cdc_leading_causes_death.zip
      sha256: 02f40c459187de1045487282bbc00e6da3b275c3151d9a366ef31fbdfbe6ed56  # deterministic: sorted, stored, fixed metadata
      contents:
        - {name: leading_causes_of_death.csv, from: leading_causes_of_death.csv, make: copy}

  - name: cdc_provisional_covid_deaths_sex_age
    title: Provisional COVID-19 Deaths by Sex and Age (NCHS)
    landing_page: https://data.cdc.gov/NCHS/Provisional-COVID-19-Deaths-by-Sex-and-Age/9bhg-hcku
    license:
      id: US-Government-Public-Domain
      url: https://www.usa.gov/government-works
      terms: Public domain (U.S. Government work). Cite NCHS. Provisional counts.
    grain: 'aggregate: state x time period (year / month / total) x sex x age group'
    rows: 137700
    id_column: composite key (Group, Year, Month, State, Sex, Age Group)
    missing_tokens: ['blank = suppressed count 1-9 (Footnote explains)']
    living: true
    files:
      - path: provisional_covid_deaths_sex_age.csv
        url: https://data.cdc.gov/api/views/9bhg-hcku/rows.csv?accessType=DOWNLOAD
        kind: table
        sha256: 8e78f4f2cc62fcdaad220f7f00ab86c0192030450632e276efa76fd8749d7aef
        bytes: 24787720
    dictionary_url: https://data.cdc.gov/NCHS/Provisional-COVID-19-Deaths-by-Sex-and-Age/9bhg-hcku
    upload_package:
      zip: cdc_provisional_covid_deaths_sex_age.zip
      sha256: 70dee79c0c5bab4e7e989e14df5a87df49e6586eacd8bc34ffc52ca77074d077  # deterministic: sorted, stored, fixed metadata
      contents:
        - {name: provisional_covid_deaths_sex_age.csv, from: provisional_covid_deaths_sex_age.csv, make: copy}

  - name: cdc_respnet_rates
    title: RESP-NET Rates and Clinical Data (COVID-NET, FluSurv-NET, RSV-NET)
    landing_page: https://data.cdc.gov/Public-Health-Surveillance/RESP-NET-Rates-and-Clinical-Data/kvib-3txy
    license:
      id: US-Government-Public-Domain
      url: https://www.usa.gov/government-works
      terms: "Public domain (U.S. Government work). Cite CDC RESP-NET. Updated weekly: checksum WILL drift; harness should treat mismatch as 'refreshed' not 'corrupt' and re-snapshot."
    grain: 'aggregate: network x season x week x site x age x sex x race'
    rows: 125988
    id_column: composite key
    missing_tokens: ['blank (Rate Type null for some rows)']
    living: true
    files:
      - path: respnet_rates.csv
        url: https://data.cdc.gov/api/views/kvib-3txy/rows.csv?accessType=DOWNLOAD
        kind: table
        sha256: 6ea38d27ec598497609240ff4c19c40b33e007f245695964f9f559912fe68a1d
        bytes: 15196988
    dictionary_url: https://data.cdc.gov/Public-Health-Surveillance/RESP-NET-Rates-and-Clinical-Data/kvib-3txy
    upload_package:
      zip: cdc_respnet_rates.zip
      sha256: 37cf5821725b92c0f21ae982c9b1397849216e9fa8cc4462b1ab51c154be7870  # deterministic: sorted, stored, fixed metadata
      contents:
        - {name: respnet_rates.csv, from: respnet_rates.csv, make: copy}

  - name: cdc_chronic_disease_indicators_immunization
    title: U.S. Chronic Disease Indicators (CDI) - Immunization topic subset
    landing_page: https://data.cdc.gov/Chronic-Disease-Indicators/U-S-Chronic-Disease-Indicators/hksd-2xuw
    license:
      id: ODbL-1.0
      url: http://opendatacommons.org/licenses/odbl/1.0/
      terms: 'data.cdc.gov metadata lists ODbL 1.0 for this dataset (not public domain): attribute CDC, share-alike for derived databases.'
    grain: 'aggregate: state x year x stratification (sex / age / race) x indicator'
    rows: 23925
    id_column: composite key (yearstart, locationabbr, questionid, datavaluetypeid, stratificationid1)
    missing_tokens: ["blank with footnote symbol '*' or '****' (suppressed / insufficient sample)"]
    living: true
    files:
      - path: cdi_immunization.csv
        url: https://data.cdc.gov/resource/hksd-2xuw.csv?$where=topic%3D%27Immunization%27&$order=%3Aid&$limit=100000
        kind: table
        note: Deterministic SoQL subset (topic='Immunization', ordered by :id) of a 398,793-row dataset.
        sha256: cc9523d3a5b4adb8af63a1f6a4cb676676d316e02bec96972ec736826a9676db
        bytes: 7619300
    dictionary_url: https://data.cdc.gov/Chronic-Disease-Indicators/U-S-Chronic-Disease-Indicators/hksd-2xuw
    upload_package:
      zip: cdc_chronic_disease_indicators_immunization.zip
      sha256: 6acffe2112c3f5f4cab57b91c48b32766f8b7ccc646937970a707081747e7fa9  # deterministic: sorted, stored, fixed metadata
      contents:
        - {name: cdi_immunization.csv, from: cdi_immunization.csv, make: copy}

  - name: cms_hai_hospital
    title: CMS Hospital Compare - Healthcare Associated Infections (Hospital and State), NHSN-derived
    landing_page: https://data.cms.gov/provider-data/dataset/77hc-ibv8
    license:
      id: US-Government-Public-Domain
      url: https://data.cms.gov/sites/default/files/2022-08/API%20FAQ%20v1_0.pdf
      terms: U.S. Government work, public domain per CMS API FAQ; no DUA for Provider Data Catalog public files. CMS name may not imply endorsement.
    grain: 'aggregate: facility x measure (long format), single reporting period 2025-01-01 to 2025-12-31'
    rows: {hospital: 172332, state: 1008}
    id_column: Facility ID (CCN) + Measure ID
    missing_tokens: ["'Not Available' (78,690 Score cells)", blank Footnote]
    living: true
    files:
      - path: Healthcare_Associated_Infections-Hospital.csv
        url: https://data.cms.gov/provider-data/sites/default/files/resources/43825e12dc0c923df9ba5cbdf473c9d5_1792599610/Healthcare_Associated_Infections-Hospital.csv
        kind: table
        note: Resource URL changes on each quarterly refresh; resolve the current one from https://data.cms.gov/provider-data/api/1/metastore/schemas/dataset/items/77hc-ibv8 (distribution[0].downloadURL).
        sha256: 586b831541f567106c438c7f72cb312786282a55fe8a98559e8d990fa8144001
        bytes: 38533341
      - path: Healthcare_Associated_Infections-State.csv
